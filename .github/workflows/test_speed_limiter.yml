name: test speed limiter

# Runs the speed limiter unit tests and SITL autotests whenever the attitude controller,
# PID library, Copter code or the autotests change.
on:
  push:
    branches:
      - 'feature/**'
    paths:
      - 'libraries/AC_AttitudeControl/**'
      - 'libraries/AC_PID/**'
      - 'ArduCopter/**'
      - 'Tools/autotest/arducopter.py'
      - '.github/workflows/test_speed_limiter.yml'
  pull_request:
    paths:
      - 'libraries/AC_AttitudeControl/**'
      - 'libraries/AC_PID/**'
      - 'ArduCopter/**'
      - 'Tools/autotest/arducopter.py'
      - '.github/workflows/test_speed_limiter.yml'
  workflow_dispatch:

concurrency:
  group: ci-${{github.workflow}}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  speed-limiter:
    runs-on: ubuntu-22.04
    container:
      image: ardupilot/ardupilot-dev-base:v0.1.3
      options: --privileged --cap-add=SYS_PTRACE --security-opt apparmor=unconfined --security-opt seccomp=unconfined
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      # waf in this 4.3 tree needs Python 3.10 or older
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: python packages for the build and autotests
        run: |
          python -m pip install --upgrade pip
          python -m pip install empy==3.3.4 future lxml pexpect dronecan pymavlink MAVProxy

      - name: build SITL and unit test
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          python ./waf configure --board sitl
          python ./waf copter
          python ./waf --target tests/test_speed_limiter

      - name: unit tests
        shell: bash
        run: ./build/sitl/tests/test_speed_limiter

      - name: SITL autotests
        shell: bash
        run: |
          python Tools/autotest/autotest.py --no-clean \
            test.Copter.SpeedLimitAttitudeDisabledSanity \
            test.Copter.SpeedLimitAttitudeAltHold \
            test.Copter.SpeedLimitAttitudeSteeringAndYaw \
            test.Copter.SpeedLimitAttitudeAuto \
            test.Copter.SpeedLimitAttitudeTailwindAboveLimit \
            test.Copter.SpeedLimitRecoversAfterTailwindDrops \
            test.Copter.SpeedLimitLoiter \
            test.Copter.SpeedLimitGuidedVelocity \
            test.Copter.SpeedLimitModeTransitions \
            test.Copter.SpeedLimitEnableInFlight \
            test.Copter.SpeedLimitLowerLimitInFlight \
            test.Copter.SpeedLimitGPSOutage \
            test.Copter.SpeedLimitRCFailsafeRTL \
            test.Copter.SpeedLimitNoOvershootAfterGroundWait \
            test.Copter.SpeedLimitVibration \
            test.Copter.SpeedLimitFenceBreachAltHold \
            test.Copter.SpeedLimitFenceBreachAltHoldNoLimiter \
            test.Copter.SpeedLimitFenceAvoidLoiter \
            test.Copter.SpeedLimitFenceAvoidLoiterTailwind \
            test.Copter.SpeedLimitFenceBreachAltHoldTailwind \
            test.Copter.SpeedLimitPilotOverride

      - name: keep logs if something failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: speed-limiter-logs
          path: |
            /tmp/buildlogs
            logs/
          retention-days: 14