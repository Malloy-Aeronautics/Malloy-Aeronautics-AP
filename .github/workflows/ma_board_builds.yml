name: MA board builds

# Builds Copter for every board we ship, plus the parameter documentation check.
# Runs on feature and release branches and on PRs into release, so a change that
# breaks a flight controller build is caught before a tag is cut.

on:
  push:
    branches:
      - 'feature/**'
      - 'release/**'
    paths-ignore:
      - '**.md'
  pull_request:
    branches:
      - 'release/**'
    paths-ignore:
      - '**.md'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  board:
    runs-on: ubuntu-22.04
    # same image test_chibios.yml uses
    container: ardupilot/ardupilot-dev-chibios:v0.1.3
    strategy:
      fail-fast: false
      matrix:
        # must match the boards built in build_release_firmware.yml
        # (CubeOrange is the hwdef used for the CubeBlue flight controller)
        board: [
          CubeOrange,
          mRoControlZeroOEMH7,
        ]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      # waf in this 4.3 tree only runs on Python 3.10 or older (it uses the old
      # imp module and 'rU' file mode), and the newer dev images ship 3.12
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: python packages for the build
        run: |
          python -m pip install --upgrade pip
          python -m pip install empy==3.3.4 future lxml pexpect dronecan

      - name: build copter for ${{ matrix.board }}
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          python --version
          python ./waf configure --board ${{ matrix.board }}
          python ./waf copter

      - name: flash and RAM usage
        shell: bash
        run: |
          arm-none-eabi-size build/${{ matrix.board }}/bin/arducopter | tee size.txt
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ matrix.board }}" >> "$GITHUB_STEP_SUMMARY"
          cat size.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: arducopter-${{ matrix.board }}
          path: |
            build/${{ matrix.board }}/bin/arducopter.apj
            build/${{ matrix.board }}/bin/arducopter_with_bl.hex
          if-no-files-found: error
          retention-days: 14

  param-docs:
    # fails on malformed @Param / @Values / @Bitmask entries in the parameter docs
    runs-on: ubuntu-22.04
    container: ardupilot/ardupilot-dev-base:v0.1.3
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: python packages for the docs check
        run: python -m pip install lxml

      - name: check copter parameter documentation
        shell: bash
        run: |
          python Tools/autotest/param_metadata/param_parse.py --vehicle ArduCopter
