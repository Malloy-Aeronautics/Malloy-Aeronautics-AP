name: MA lint

# Lints only the lines a branch changes compared with the release branch (see
# Tools/scripts/ma_lint.py), so old code does not block new work but new code has to be clean.

on:
  push:
    branches:
      - 'feature/**'
      - 'release/**'
  pull_request:
    branches:
      - 'release/**'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # on a PR compare with the branch it targets, otherwise with the current release branch
  LINT_BASE: origin/${{ github.base_ref || 'release/MA-4.3.0.17' }}
  ACTIONLINT_VERSION: '1.7.7'

jobs:
  lint:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0       # full history so the merge base with the release branch exists

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: install linters
        run: |
          python -m pip install flake8==7.1.1
          curl -sSL -o actionlint.tgz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          tar xzf actionlint.tgz actionlint
          sudo mv actionlint /usr/local/bin/

      - name: lint changed lines
        run: python Tools/scripts/ma_lint.py --base "$LINT_BASE"

  compiler-warnings:
    # most warnings are already errors in ArduPilot builds, this catches the rest
    runs-on: ubuntu-22.04
    container:
      image: ardupilot/ardupilot-dev-base:v0.1.3
      options: --privileged
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: 'recursive'

      # waf in this 4.3 tree needs Python 3.10 or older
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: python packages for the build
        run: python -m pip install empy==3.3.4 future lxml pexpect dronecan

      - name: build copter SITL
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          python ./waf configure --board sitl
          python ./waf copter 2>&1 | tee build.log
          test "${PIPESTATUS[0]}" -eq 0

      - name: warnings on changed lines
        run: python Tools/scripts/ma_lint.py --base "$LINT_BASE" --build-log build.log
